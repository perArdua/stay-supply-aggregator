spring:
  application:
    name: stay-supply-aggregator

  # 스키마의 단일 소유자는 Flyway. 엔티티가 스키마를 만들지 않는다.
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

  # 테스트에서도 compose로 뜬 DB를 쓴다 (기본값 true면 건너뛴다)
  docker:
    compose:
      skip:
        in-tests: false

# 기동 중 readiness가 닫혀 있다가 ApplicationRunner가 끝나면 열리는 동작에 기대므로
# 기본값에 맡기지 않고 명시한다. 부트 4는 기본이 켬이지만 버전에 따라 달라져 왔다
management:
  endpoint:
    health:
      probes:
        enabled: true

# 로컬 기본값은 Mock Supplier(9090). 실제 공급사 주소는 환경변수로 덮어쓴다.
# 각 항목은 공급사마다 다른 값을 사용해야 함
# 하지만 Mock 환경이기 때문에 timeout 값을 다르게 둘 근거를 못찾았기 때문에
# timeout은 같은 값으로 둠
# api-key도 마찬가지임
# 다만, base-url은 다르게 둘 가치가 있다고 판단했기 때문에 다르게 둠
suppliers:
  a:
    base-url: http://localhost:9090
    api-key: dummy-key
    connect-timeout-millis: 1000   # TCP 연결 수립까지
    # 숙소 목록은 하루 한 번 배치로 부르고 고객이 기다리지 않으므로 크게 잡는다
    property-list-timeout-millis: 10000
    # 재고 조회는 검색마다 부르고 고객 대기 시간에 그대로 묶이므로 공급사 SLA 상한을 쓴다
    availability-timeout-millis: 500
  b:
    base-url: http://localhost:9091
    api-key: dummy-key
    connect-timeout-millis: 1000
    property-list-timeout-millis: 10000
    availability-timeout-millis: 500

# 한 공급사에 동시에 나가는 청크 호출 수의 상한.
# 공급사에서 숙소 4000개에 대한 정보를 준다고 가정했을 때 데드라인 안에 처리하려면 최소 8로 두어야 함
# 다만 테스트를 해보았을 때 약 5 ~ 6초 사이로 나오므로 넉넉잡아 10으로 설정함
# Mock 환경이기 때문에 deadline 시간은 5초라고 전제로 깔아둠
search:
  max-concurrent-calls-per-supplier: 10
  deadline-millis: 5000

# 죽은 공급사에 청크를 계속 던지지 않도록 공급사별로 서킷을 둔다.
# 인스턴스는 공급사 이름으로 실행 중에 만들어지므로 default 하나만 정의한다.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        # 동시 호출 상한 값과 같게 설정
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        # 절반 이상 실패면 정상이 아니라고 판단
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        # 프로브는 공급사가 살아났는지 보는 것이 목적이라 실제 작업을 여러 건 보낼 이유가 없음
        # 검색 하나가 청크를 동시에 내보내므로 정원을 키우면 회복 중인 공급사가 그만큼을 한꺼번에 받게 되고 멀티 인스턴스면 인스턴스 수를 곱한 만큼 받게 됨
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true

# 공급사 매핑 정기 재동기화. 트래픽이 적은 새벽에 하루 한 번.
sync:
  cron: "0 0 4 * * *"
