spring:
  application:
    name: stay-supply-aggregator

  # 스키마의 단일 소유자는 Flyway. 엔티티가 스키마를 만들지 않는다.
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

  # 테스트에서도 compose로 뜬 DB를 쓴다 (기본값 true면 건너뛴다)
  docker:
    compose:
      skip:
        in-tests: false

# 로컬 기본값은 Mock Supplier(9090). 실제 공급사 주소는 환경변수로 덮어쓴다.
suppliers:
  a:
    base-url: http://localhost:9090
    api-key: dummy-key
    connect-timeout-millis: 1000   # TCP 연결 수립까지
    overall-timeout-millis: 3000   # 요청 시작~응답 완료 총 상한. 임시값 - 견고성 단계에서 확정
  b:
    base-url: http://localhost:9090
    api-key: dummy-key
    connect-timeout-millis: 1000
    overall-timeout-millis: 3000

# 공급사 매핑 정기 재동기화. 트래픽이 적은 새벽에 하루 한 번.
sync:
  cron: "0 0 4 * * *"
